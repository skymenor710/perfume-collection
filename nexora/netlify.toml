# Déploiement Netlify — voir README.md § « Netlify ». Rien n'est publié tant que le site n'est pas relié à Netlify.
# Variables d'environnement (Site configuration › Environment variables, portée « Builds » ET « Functions ») :
#   NODE_ENV=production, PUBLIC_URL, SESSION_SECRET, DATABASE_URL (PostgreSQL : Neon / Netlify DB),
#   STORAGE_DRIVER=s3 + S3_* (Cloudflare R2…), UPLOAD_MAX_MB=4, MAIL_* (Brevo ; valeurs dans README § 3 bis, la clé
#   MAIL_API_KEY uniquement dans Netlify), et facultativement ANALYTICS_*.

[build]
  # Fichiers du navigateur (dist/client), migrations de la base (contexte production seulement ; refusées si la base
  # n'est pas PostgreSQL), puis /version.txt (commit déployé).
  # Le seed restaure les trois projets clients seulement si le portfolio est vide ; il ne touche à rien ensuite.
  command = "npm run build && npm run db:migrate && npm run db:seed && node scripts/build-info.mjs"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Modules natifs ou à fichiers annexes : copiés tels quels plutôt qu'intégrés au paquet.
  external_node_modules = ["sharp", "pg", "@electric-sql/pglite"]
  # Manifeste Vite et CSS : le CSS est intégré à chaque page (autorisé par son empreinte dans la CSP).
  # Le manifeste reste hors de `.vite/`, répertoire caché que le bundler peut omettre.
  included_files = ["dist/client/manifest.json", "dist/client/assets/*.css"]

# Une seule adresse publique : l'adresse technique Netlify renvoie vers le domaine (pas de site en double ; l'admin
# n'y fonctionne de toute façon pas, l'origine ne correspondant pas à PUBLIC_URL).
[[redirects]]
  from = "https://nexora-creation.netlify.app/*"
  to = "https://nexora-creation.fr/:splat"
  status = 301
  force = true

[[headers]]
  for = "/version.txt"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

# Fichiers statiques (servis par le CDN). Les pages HTML viennent de la fonction, avec leurs propres en-têtes de
# sécurité (CSP, HSTS, X-Frame-Options… : src/server/lib/security.ts).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"
